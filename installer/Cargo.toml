[package]
name = "shroomvr-installer"
# The real version comes from the release tag (SHROOMVR_VERSION at build time).
version = "0.0.0"
license = "MIT"
publish = false
edition = "2024"

[dependencies]
crc32fast = "1.5.2"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
ureq = "3.4.2"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"
